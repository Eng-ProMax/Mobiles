<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسعار الهواتف الذكية في العراق</title>
    <!-- استدعاء مكتبة التصميم Tailwind لترتيب المظهر -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 p-6">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-3xl font-bold text-blue-600 mb-2">📱 أسعار الهواتف والمجهزين</h1>
            <p class="text-gray-500">تحديث حي ومباشر من قاعدة البيانات المركزية</p>
        </header>

        <!-- مكان عرض المنتجات -->
        <div id="products-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <p class="text-center col-span-2 text-gray-500">جاري تحميل أحدث الأسعار من السيرفر...</p>
        </div>
    </div>

    <script>
        // ⚠️ ضع روابط الـ Supabase الخاصة بك هنا مباشرة
        const SUPABASE_URL = "https://wagxxledanjltesnjhjo.supabase.co";
        const SUPABASE_KEY = "sb_publishable_g6t26mPCnubitvypBM15Ew_O50GdfMv";

        async function fetchProducts() {
            const productsContainer = document.getElementById('products-list');
            try {
                // الاتصال بـ Supabase وجلب المنتجات مع المجهزين
                const response = await fetch(${SUPABASE_URL}/rest/v1/Products?select=product_name,brand,storage_size,current_price_usd,Suppliers(supplier_name,location_details), {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": Bearer ${SUPABASE_KEY}
                    }
                });
                
                const products = await response.json();
                productsContainer.innerHTML = ''; // مسح جملة التحميل

                // عرض المنتجات ككروت بتصميم أنيق
                products.forEach(item => {
                    const supplier = item.Suppliers || { supplier_name: "غير محدد", location_details: "غير محدد" };
                    const card = 
                        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-lg text-gray-900">${item.product_name}</h3>
                                <span class="bg-green-100 text-green-700 text-sm font-semibold px-3 py-1 rounded-full">$${item.current_price_usd}</span>
                            </div>
                            <p class="text-gray-500 text-sm mb-4">الماركة: ${item.brand} | المساحة: ${item.storage_size}</p>
                            <div class="border-t pt-3 text-xs text-gray-400">
                                <p>🏬 المجهز: <span class="text-gray-600 font-medium">${supplier.supplier_name}</span></p>
                                <p>📍 العنوان: <span class="text-gray-600">${supplier.location_details}</span></p>
                            </div>
                        </div>
                    ;
                    productsContainer.innerHTML += card;
                });
            } catch (error) {
                productsContainer.innerHTML = <p class="text-center text-red-500 col-span-2">حدث خطأ أثناء جلب البيانات: ${error.message}</p>;
            }
        }

        // تشغيل الدالة عند فتح الصفحة
        fetchProducts();
    </script>
</body>
</html>
