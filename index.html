<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Iraq Tech Market</title>
</head>

<body>

<div id="products"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const { createClient } = supabase;

const supabaseUrl = "https://wagxxledanjltesnjhjo.supabase.co";
const supabaseKey = "sb_publishable_g6t26mPCnubitvypBM15Ew_O50GdfMv";

const db = createClient(supabaseUrl, supabaseKey);

async function loadProducts() {

    const { data, error } = await db
        .from("Products")
        .select("*");

    if (error) {
        console.log(error);
        return;
    }

    let html = "";

    data.forEach(product => {

        html += 
        <div style="border:1px solid #ddd;padding:15px;margin:10px;border-radius:10px">
            <h2>${product.product_name}</h2>
            <p>Brand: ${product.brand}</p>
            <p>Storage: ${product.storage_size}</p>
            <h3>$${product.current_price_usd}</h3>
        </div>
        ;

    });

    document.getElementById("products").innerHTML = html;

}

loadProducts();
</script>

</body>
</html>
