<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسعار الهواتف الذكية في العراق</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 p-6">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-3xl font-bold text-blue-600 mb-2"> أسعار الهواتف والمجهزين</h1>
            <p class="text-gray-500">تحديث حي ومباشر من قاعدة البيانات المركزية</p>
        </header>

        <div id="products-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <p class="text-center col-span-2 text-gray-500">جاري تحميل أحدث الأسعار من السيرفر...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://wagxxledanjltesnjhjo.supabase.co";
        const SUPABASE_KEY = "sb_publishable_g6t26mpCnubityvypBM15Ew_O5OGdfMv";

        async function fetchProducts() {
            const productsContainer = document.getElementById('products-list');
            try {
                // استعلام مباشر ومبسط لجلب المنتجات والمجهزين لتلافي أي حظر أمني أو تكرار
                const response = await fetch(${SUPABASE_URL}/rest/v1/products?select=product_name,brand,storage_size,current_price_usd,suppliers(supplier_name,location_details), {
                    method: 'GET',
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": Bearer ${SUPABASE_KEY}
                    }
                });
                
                if (!response.ok) throw new Error(خطأ في السيرفر: ${response.status});
                
                const products = await response.json();
                productsContainer.innerHTML = ''; 

                if (products.length === 0) {
                    productsContainer.innerHTML = '<p class="text-center col-span-2 text-gray-500">لا توجد أجهزة مضافة حالياً.</p>';
                    return;
                }

                products.forEach(item => {
                    // حماية إضافية في حال كان اسم حقل المورد فرعياً
                    const supplier = item.suppliers || {};
                    const sName = supplier.supplier_name || "مجموعات النهرين لتجارة الموبايل";
                    const sLoc = supplier.location_details || "بغداد - شارع الربيعي";

                    const card = 
                        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-lg text-gray-900">${item.product_name}</h3>
                                <span class="bg-green-100 text-green-700 text-sm font-semibold px-3 py-1 rounded-full">$${item.current_price_usd}</span>
                            </div>
                            <p class="text-gray-500 text-sm mb-4">الماركة: ${item.brand} | المساحة: ${item.storage_size}</p>
                            <div class="border-t pt-3 text-xs text-gray-400">
                                <p> المجهز: <span class="text-gray-600 font-medium">${sName}</span></p>
                                <p> العنوان: <span class="text-gray-600">${sLoc}</span></p>
                            </div>
                        </div>
                    ;
                    productsContainer.innerHTML += card;
                });
            } catch (error) {
                console.error(error);
                productsContainer.innerHTML = <p class="text-center text-red-500 col-span-2">حدث خطأ أثناء جلب البيانات. يرجى إعادة المحاولة.</p>;
            }
        }

        fetchProducts();
    </script>
</body>
</html>
